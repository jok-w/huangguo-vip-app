name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/huangguo_vip"
          flutter config --jdk-dir "$JAVA_HOME"
          # Generate portable Gradle files. The upstream settings point to the author's local SDK.
          flutter create --platforms=android --org com.huangguo --project-name huangguo_vip --no-pub "$project"
          cp -R android/app/src/. "$project/android/app/src/"
          cp -R lib/. "$project/lib/"
          cp pubspec.yaml pubspec.lock "$project/"
          cd "$project"
          flutter pub get
          flutter build apk --debug --no-pub

      - uses: actions/upload-artifact@v4
        with:
          name: huangguo-android-apk
          path: ${{ runner.temp }}/huangguo_vip/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
